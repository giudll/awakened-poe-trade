publish:
  - "github"
productName: "Awakened PoE Trade"
npmRebuild: false
# Keep the Chinese build distinguishable in the Releases list. The version is
# rewritten by CI, see `.github/workflows/zh-cn.yml`.
artifactName: "AwakenedPoE-Trade-zh-${version}-${arch}.${ext}"
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "AwakenedPoE-Trade-zh-Setup-${version}.${ext}"
portable:
  artifactName: "AwakenedPoE-Trade-zh-Portable-${version}.${ext}"
win:
  target:
  - "nsis"
  - "portable"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
