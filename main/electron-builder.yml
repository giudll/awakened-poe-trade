publish:
  - "github"
productName: "Awakened PoE Trade"
npmRebuild: false
# These are spelled out because CI uploads the files itself instead of letting
# electron-builder publish. Left to its defaults, electron-builder writes
# `Awakened.PoE.Trade.Setup-x.exe` on disk but `Awakened-PoE-Trade-Setup-x.exe`
# into latest.yml, and the updater would then download a file that is not on the
# release. They also happen to be the names the upstream release uses.
artifactName: "Awakened-PoE-Trade-${version}-${arch}.${ext}"
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "Awakened-PoE-Trade-Setup-${version}.${ext}"
portable:
  artifactName: "Awakened-PoE-Trade-${version}.${ext}"
win:
  target:
  - "nsis"
  - "portable"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
