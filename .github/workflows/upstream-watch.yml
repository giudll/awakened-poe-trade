name: upstream-watch

# Watches the original repository. When `SnosMe/awakened-poe-trade` gets a new
# commit on `master`, the fork merges it, regenerates the Simplified Chinese
# bundle and rebuilds the installers.
#
# Both halves of the automation are independent on purpose:
#   - upstream code changed  -> this workflow (merge, rebuild data, dispatch build)
#   - 编年史 patch changed    -> `zh-data.yml` (rebuild data, dispatch build)
#   - neither changed        -> nothing is committed and nothing is rebuilt.
#
# A merge conflict or a UI string that has no Chinese yet is reported as an
# issue instead of pushing a broken branch.
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Merge even if the upstream commit did not change'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: feat/zh-cn
        fetch-depth: 0

    - uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Check for a new upstream commit
      id: probe
      run: |
        set -euo pipefail
        repo=$(node -p "require('./tools/zh-data/upstream.lock.json').repo")
        branch=$(node -p "require('./tools/zh-data/upstream.lock.json').branch")
        locked=$(node -p "require('./tools/zh-data/upstream.lock.json').commit")
        upstream=$(git ls-remote "https://github.com/${repo}.git" "refs/heads/${branch}" | cut -f1)
        echo "upstream=$upstream"
        echo "locked=$locked"
        echo "repo=$repo" >> "$GITHUB_OUTPUT"
        echo "branch=$branch" >> "$GITHUB_OUTPUT"
        echo "commit=$upstream" >> "$GITHUB_OUTPUT"
        if [ "$upstream" = "$locked" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Merge the upstream branch
      if: steps.probe.outputs.changed == 'true'
      id: merge
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git remote add upstream "https://github.com/${{ steps.probe.outputs.repo }}.git"
        git fetch --no-tags upstream "${{ steps.probe.outputs.branch }}"
        # --no-commit keeps the staged tree around so the regenerated data lands
        # in the same commit as the merge.
        if git merge --no-ff --no-commit FETCH_HEAD; then
          echo "conflict=false" >> "$GITHUB_OUTPUT"
        else
          echo "conflict=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Report a merge conflict
      if: steps.merge.outputs.conflict == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        COMMIT: ${{ steps.probe.outputs.commit }}
      run: |
        set -euo pipefail
        files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
        git merge --abort || true
        title="upstream merge conflict at ${COMMIT:0:7}"
        body=$(printf 'Merging `%s` into `feat/zh-cn` failed.\n\nConflicting files: `%s`\n\nResolve it locally, push, and the build will continue on its own.' "$COMMIT" "$files")
        if gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number' | grep -q .; then
          echo "issue already open, leaving it alone"
        else
          gh issue create --title "$title" --body "$body"
        fi
        exit 1

    - name: Regenerate the Chinese bundle
      if: steps.probe.outputs.changed == 'true' && steps.merge.outputs.conflict == 'false'
      id: rebuild
      run: |
        set -euo pipefail
        cd tools/zh-data
        # Fails when upstream introduced a UI string without a translation, or
        # when the 编年史 patch is behind and the coverage gates break.
        if node build-app-i18n.mjs && node build-all.mjs; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Report a localization gap
      if: steps.rebuild.outputs.ok == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        COMMIT: ${{ steps.probe.outputs.commit }}
      run: |
        set -euo pipefail
        git checkout -- . || true
        title="upstream ${COMMIT:0:7} needs new Chinese strings"
        body=$(printf 'The merge of `%s` succeeded but the Chinese bundle could not be rebuilt.\n\nRead the job log for the exact key or gate that failed. Most likely a new UI string in `app_i18n.json`, or the 编年史 patch is behind upstream.' "$COMMIT")
        if gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number' | grep -q .; then
          echo "issue already open, leaving it alone"
        else
          gh issue create --title "$title" --body "$body"
        fi
        exit 1

    - name: Verify the regenerated data still parses Chinese items
      if: steps.rebuild.outputs.ok == 'true'
      run: |
        set -euo pipefail
        cd renderer
        npm ci
        npm run check:items

    - name: Commit the merge
      if: steps.rebuild.outputs.ok == 'true'
      run: |
        set -euo pipefail
        node -e '
          const fs = require("fs")
          const file = "tools/zh-data/upstream.lock.json"
          const lock = JSON.parse(fs.readFileSync(file, "utf8"))
          lock.commit = process.argv[1]
          lock.appVersion = require("./main/package.json").version
          lock.syncedAt = new Date().toISOString()
          fs.writeFileSync(file, JSON.stringify(lock, null, 2) + "\n")
        ' "${{ steps.probe.outputs.commit }}"
        git add -A
        if git diff --cached --quiet; then
          echo 'nothing to commit'
          exit 0
        fi
        git commit -m "chore: sync upstream ${{ steps.probe.outputs.commit }}" \
          -m "Merged https://github.com/${{ steps.probe.outputs.repo }}/commit/${{ steps.probe.outputs.commit }} and regenerated the zh_CN bundle."
        git push

    - name: Rebuild the installers
      if: steps.rebuild.outputs.ok == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run zh-cn.yml --ref feat/zh-cn
