name: Build

# Builds and publishes the Simplified Chinese fork.
# The display name matches the upstream workflow on purpose: the Actions tab is
# public, and a fork that looks like every other fork is the point.
#
# The data bundle in `renderer/public/data/zh_CN/` is committed, so a plain
# checkout is enough to build. `zh-data.yml` refreshes it when the 编年史 patch
# changes, `upstream-watch.yml` merges new upstream code - both dispatch this
# workflow afterwards.
#
# Every build gets its own version and GitHub release, because that is what makes
# a running copy show "update available" (electron-updater compares versions and
# ignores pre-releases). The version is derived by `tools/zh-data/next-version.mjs`
# from the highest existing tag, so it only grows.
on:
  push:
    branches:
      - 'feat/zh-cn'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      # Lock files and the generator tools are not part of the app. A daily
      # patch repackage updates only the lock, and must not produce a release.
      - 'tools/zh-data/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (turn off for a build-only check)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: zh-cn-build
  cancel-in-progress: false

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Install the build dependencies
      working-directory: ./renderer
      run: |
        for attempt in 1 2 3; do
          if npm ci; then exit 0; fi
          echo "npm ci failed (attempt $attempt of 3), retrying in 20s"
          sleep 20
        done
        exit 1
    - run: npm run lint
      working-directory: ./renderer
    - name: Parse the Chinese regression fixtures
      run: npm run check:items
      working-directory: ./renderer
    - name: The UI translation must match upstream's keys exactly
      run: node build-app-i18n.mjs --check
      working-directory: ./tools/zh-data
    - run: npm run build
      working-directory: ./renderer
    - uses: actions/upload-artifact@v7
      with:
        name: renderer-dist
        path: ./renderer/dist
        # Keep it around for a week: re-running an older build days later is a
        # normal maintenance action, and a one-day artifact would be gone.
        retention-days: 7

  version:
    needs: renderer
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      upstream: ${{ steps.calc.outputs.upstream }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Compute the next version
      id: calc
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh release list --limit 100 --json tagName --jq '.[].tagName' > tags.txt || true
        upstream=$(node -p "require('./main/package.json').version")
        node tools/zh-data/next-version.mjs "$upstream" tags.txt | tee -a "$GITHUB_OUTPUT"

  package-windows:
    needs: [renderer, version]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - uses: actions/download-artifact@v8
      id: renderer_dist
      continue-on-error: true
      with:
        name: renderer-dist
        path: ./renderer/dist
    # Re-running only the failed jobs does not re-run `renderer`: its artifact
    # belongs to an earlier attempt and may already have expired. Build the UI
    # here so a re-run can still produce installers instead of failing in 16s.
    # `renderer` has no Electron binary in its dependencies, so this is safe on
    # the Windows runner too.
    - name: Rebuild the UI when the artifact is unavailable
      if: steps.renderer_dist.outcome == 'failure'
      working-directory: ./renderer
      shell: bash
      run: |
        ok=false
        for attempt in 1 2 3; do
          if npm ci; then ok=true; break; fi
          echo "npm ci failed (attempt $attempt of 3), retrying in 20s"
          sleep 20
        done
        if [ "$ok" != "true" ]; then exit 1; fi
        npm run build
    # The version and the release repository are written into `package.json`
    # here, never committed: electron-builder reads both, the version ends up in
    # `latest.yml` and the repository becomes the `app-update.yml` feed, i.e. the
    # place a running copy asks for the next update.
    - name: Stamp the version and the release repository
      shell: bash
      env:
        APP_VERSION: ${{ needs.version.outputs.version }}
        REPO: ${{ github.repository }}
      run: |
        node -e '
          const fs = require("fs")
          const file = "main/package.json"
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
          pkg.version = process.env.APP_VERSION
          pkg.repository.url = `https://github.com/${process.env.REPO}.git`
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n")
        '
        node -p "require('./main/package.json').version"
    # `npm ci` pulls the Electron binary from github.com/electron/releases, which
    # answers 504 for minutes at a time. Install without that one download and
    # then retry it on its own - a retry then costs seconds instead of a full
    # dependency reinstall.
    - uses: actions/cache@v4
      with:
        path: '~/AppData/Local/electron/Cache'
        key: electron-cache-${{ hashFiles('main/package-lock.json') }}
    # electron-builder downloads the same kind of artifacts (winCodeSign, nsis,
    # the Electron zip again) and hits the same 504s; its cache survives too.
    - uses: actions/cache@v4
      with:
        path: '~/AppData/Local/electron-builder/Cache'
        key: electron-builder-cache-${{ hashFiles('main/package-lock.json') }}
    # The binary comes from the step below, so skip the package's own copy: that
    # download is the one that fails, and packaging never reads it.
    - name: Install the build dependencies
      working-directory: ./main
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      run: npm ci
    # github.com/<repo>/releases/download answers 504 for minutes at a time, and
    # today it does so for every asset electron-builder wants. The API's asset
    # endpoint serves the same bytes over a different path, so the Electron zip
    # is fetched here and handed to electron-builder with `-c.electronDist`;
    # the npm package's own copy is not needed for packaging at all.
    - name: Fetch the Electron binary
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        version=$(node -p "require('./main/package.json').devDependencies.electron.replace(/^[^0-9]*/, '')")
        file="electron-v${version}-win32-x64.zip"
        dir="$RUNNER_TEMP/electron"
        mkdir -p "$dir"
        for attempt in $(seq 1 6); do
          echo "attempt $attempt: $file"
          if curl -fsSL --retry 2 --max-time 300 -o "$dir/$file" \
            "https://github.com/electron/electron/releases/download/v${version}/${file}"; then
            break
          fi
          echo "the release URL failed, trying the API asset endpoint"
          id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/electron/electron/releases/tags/v${version}" \
            | FILE="$file" node -e '
                let s = ""
                process.stdin.on("data", d => (s += d)).on("end", () => {
                  const asset = JSON.parse(s).assets.find(a => a.name === process.env.FILE)
                  if (!asset) throw new Error("no asset named " + process.env.FILE)
                  console.log(asset.id)
                })
              ') || continue
          if curl -fsSL --max-time 300 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" -o "$dir/$file" \
            "https://api.github.com/repos/electron/electron/releases/assets/${id}"; then
            break
          fi
          sleep 15
        done
        test -s "$dir/$file"
        ls -l "$dir/$file"
        echo "ELECTRON_DIST=$dir/$file" >> "$GITHUB_ENV"
        # `npm run build` requires the electron module (it reports the paths it
        # was installed with), so unpack the same zip into the package. The
        # installer itself is built from the zip, not from this copy.
        main/node_modules/7zip-bin/win/x64/7za.exe x -y -bd \
          -o"main/node_modules/electron/dist" "$dir/$file" > /dev/null
        printf 'electron.exe' > main/node_modules/electron/path.txt
    - run: npm run build
      working-directory: ./main
    # electron-builder pulls nsis and winCodeSign from the same 504-prone host.
    # The npmmirror copy is byte-identical (electron-builder checks each archive
    # against the sha512 baked into it, so a tampered file cannot get through),
    # and it is only used once the official host has already failed.
    - name: Package the installers
      working-directory: ./main
      shell: bash
      env:
        FALLBACK_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
      run: |
        set -euo pipefail
        if ! npx electron-builder build --win --x64 -p never -c.electronDist="$ELECTRON_DIST"; then
          echo "the official binaries host failed, retrying through the mirror"
          ELECTRON_BUILDER_BINARIES_MIRROR="$FALLBACK_MIRROR" \
            npx electron-builder build --win --x64 -p never -c.electronDist="$ELECTRON_DIST"
        fi
    # A running copy asks `app-update.yml` where the next build lives. If
    # electron-builder ever fell back to the upstream repository, the fork would
    # quietly update itself to the English release - the one failure mode that
    # cannot be seen until it has already happened. So the feed is inspected
    # before anything is published.
    - name: The update feed must point at this repository
      shell: bash
      env:
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        cfg=$(find main/dist -name app-update.yml -path '*resources*' | head -1)
        if [ -z "$cfg" ]; then
          echo "app-update.yml is missing, the build would ship without an update feed"
          exit 1
        fi
        echo "--- $cfg"
        cat "$cfg"
        grep -qx "provider: github" "$cfg"
        grep -qx "owner: ${REPO%%/*}" "$cfg"
        grep -qx "repo: ${REPO##*/}" "$cfg"
    - name: The updater manifest must name the files that are published
      shell: bash
      run: |
        set -euo pipefail
        node -e '
          const fs = require("fs")
          const dir = "main/dist"
          const yml = fs.readFileSync(`${dir}/latest.yml`, "utf8")
          const referenced = [...yml.matchAll(/^\s*-?\s*url:\s*(.+)$/gm)]
            .map(m => m[1].trim().replace(/^["\x27]|["\x27]$/g, ""))
          const built = fs.readdirSync(dir).filter(f => f.endsWith(".exe"))
          for (const file of referenced) {
            if (!built.includes(file)) {
              throw new Error(
                `latest.yml points at ${file}, which is not among the built files: ${built.join(", ")}`
              )
            }
          }
          console.log("latest.yml matches the built files:", referenced.join(", "))
        '
    - name: Collect artifacts
      shell: bash
      run: |
        mkdir -p artifacts
        cp main/dist/*.exe artifacts/
        cp main/dist/*.blockmap artifacts/ 2>/dev/null || true
        cp main/dist/latest.yml artifacts/
        ls -lh artifacts
    - uses: actions/upload-artifact@v7
      with:
        name: windows-build
        path: ./artifacts
        retention-days: 7

  release:
    needs: [package-windows, version]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: windows-build
        path: ./artifacts
    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ needs.version.outputs.version }}
        TAG: ${{ needs.version.outputs.tag }}
        UPSTREAM: ${{ needs.version.outputs.upstream }}
      run: |
        set -euo pipefail
        # Keep the release page indistinguishable from the upstream one: the tag
        # stays `v<version>`, the title is the bare version and there is no body,
        # which is what the original repository shows.
        gh release create "$TAG" artifacts/* \
          --title "$VERSION" \
          --notes "" \
          --latest
    # GitHub does not enforce a quota but keeps every asset forever. Keep the
    # downloads page readable and drop everything beyond the last few builds.
    - name: Prune old releases
      if: ${{ success() }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh release list --limit 100 --json tagName,isLatest --jq '.[].tagName' \
          | tail -n +6 \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "deleting $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
