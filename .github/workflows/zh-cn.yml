name: Build

# Builds and publishes the Simplified Chinese fork.
# The display name matches the upstream workflow on purpose: the Actions tab is
# public, and a fork that looks like every other fork is the point.
#
# The data bundle in `renderer/public/data/zh_CN/` is committed, so a plain
# checkout is enough to build. `zh-data.yml` refreshes it when the 编年史 patch
# changes, `upstream-watch.yml` merges new upstream code - both dispatch this
# workflow afterwards.
#
# Every build gets its own version and GitHub release, because that is what makes
# a running copy show "update available" (electron-updater compares versions and
# ignores pre-releases). The version is derived by `tools/zh-data/next-version.mjs`
# from the highest existing tag, so it only grows.
on:
  push:
    branches:
      - 'feat/zh-cn'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (turn off for a build-only check)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: zh-cn-build
  cancel-in-progress: false

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Install the build dependencies
      working-directory: ./renderer
      run: |
        for attempt in 1 2 3; do
          if npm ci; then exit 0; fi
          echo "npm ci failed (attempt $attempt of 3), retrying in 20s"
          sleep 20
        done
        exit 1
    - run: npm run lint
      working-directory: ./renderer
    - name: Parse the Chinese regression fixtures
      run: npm run check:items
      working-directory: ./renderer
    - name: The UI translation must match upstream's keys exactly
      run: node build-app-i18n.mjs --check
      working-directory: ./tools/zh-data
    - run: npm run build
      working-directory: ./renderer
    - uses: actions/upload-artifact@v7
      with:
        name: renderer-dist
        path: ./renderer/dist
        retention-days: 1

  version:
    needs: renderer
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      upstream: ${{ steps.calc.outputs.upstream }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Compute the next version
      id: calc
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh release list --limit 100 --json tagName --jq '.[].tagName' > tags.txt || true
        upstream=$(node -p "require('./main/package.json').version")
        node tools/zh-data/next-version.mjs "$upstream" tags.txt | tee -a "$GITHUB_OUTPUT"

  package-windows:
    needs: [renderer, version]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - uses: actions/download-artifact@v8
      with:
        name: renderer-dist
        path: ./renderer/dist
    # The version and the release repository are written into `package.json`
    # here, never committed: electron-builder reads both, the version ends up in
    # `latest.yml` and the repository becomes the `app-update.yml` feed, i.e. the
    # place a running copy asks for the next update.
    - name: Stamp the version and the release repository
      shell: bash
      env:
        APP_VERSION: ${{ needs.version.outputs.version }}
        REPO: ${{ github.repository }}
      run: |
        node -e '
          const fs = require("fs")
          const file = "main/package.json"
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
          pkg.version = process.env.APP_VERSION
          pkg.repository.url = `https://github.com/${process.env.REPO}.git`
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n")
        '
        node -p "require('./main/package.json').version"
    # `npm ci` pulls the Electron binary from github.com/electron/releases, which
    # answers 504 for minutes at a time. Install without that one download and
    # then retry it on its own - a retry then costs seconds instead of a full
    # dependency reinstall.
    - uses: actions/cache@v4
      with:
        path: '~/AppData/Local/electron/Cache'
        key: electron-cache-${{ hashFiles('main/package-lock.json') }}
    # electron-builder downloads the same kind of artifacts (winCodeSign, nsis,
    # the Electron zip again) and hits the same 504s; its cache survives too.
    - uses: actions/cache@v4
      with:
        path: '~/AppData/Local/electron-builder/Cache'
        key: electron-builder-cache-${{ hashFiles('main/package-lock.json') }}
    - name: Install the build dependencies
      working-directory: ./main
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      run: |
        npm ci
        unset ELECTRON_SKIP_BINARY_DOWNLOAD
        for attempt in $(seq 1 20); do
          if node node_modules/electron/install.js; then exit 0; fi
          echo "electron download failed (attempt $attempt of 20), retrying in 20s"
          sleep 20
        done
        exit 1
    - run: npm run build
      working-directory: ./main
    - name: Package the installers
      working-directory: ./main
      run: npx electron-builder build --win --x64 -p never
    # A running copy asks `app-update.yml` where the next build lives. If
    # electron-builder ever fell back to the upstream repository, the fork would
    # quietly update itself to the English release - the one failure mode that
    # cannot be seen until it has already happened. So the feed is inspected
    # before anything is published.
    - name: The update feed must point at this repository
      shell: bash
      env:
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        cfg=$(find main/dist -name app-update.yml -path '*resources*' | head -1)
        if [ -z "$cfg" ]; then
          echo "app-update.yml is missing, the build would ship without an update feed"
          exit 1
        fi
        echo "--- $cfg"
        cat "$cfg"
        grep -qx "provider: github" "$cfg"
        grep -qx "owner: ${REPO%%/*}" "$cfg"
        grep -qx "repo: ${REPO##*/}" "$cfg"
    - name: The updater manifest must name the files that are published
      shell: bash
      run: |
        set -euo pipefail
        node -e '
          const fs = require("fs")
          const dir = "main/dist"
          const yml = fs.readFileSync(`${dir}/latest.yml`, "utf8")
          const referenced = [...yml.matchAll(/^\s*-?\s*url:\s*(.+)$/gm)]
            .map(m => m[1].trim().replace(/^["\x27]|["\x27]$/g, ""))
          const built = fs.readdirSync(dir).filter(f => f.endsWith(".exe"))
          for (const file of referenced) {
            if (!built.includes(file)) {
              throw new Error(
                `latest.yml points at ${file}, which is not among the built files: ${built.join(", ")}`
              )
            }
          }
          console.log("latest.yml matches the built files:", referenced.join(", "))
        '
    - name: Collect artifacts
      shell: bash
      run: |
        mkdir -p artifacts
        cp main/dist/*.exe artifacts/
        cp main/dist/*.blockmap artifacts/ 2>/dev/null || true
        cp main/dist/latest.yml artifacts/
        ls -lh artifacts
    - uses: actions/upload-artifact@v7
      with:
        name: windows-build
        path: ./artifacts
        retention-days: 7

  release:
    needs: [package-windows, version]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: windows-build
        path: ./artifacts
    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ needs.version.outputs.version }}
        TAG: ${{ needs.version.outputs.tag }}
        UPSTREAM: ${{ needs.version.outputs.upstream }}
      run: |
        set -euo pipefail
        # Keep the release page indistinguishable from the upstream one: the tag
        # stays `v<version>`, the title is the bare version and there is no body,
        # which is what the original repository shows.
        gh release create "$TAG" artifacts/* \
          --title "$VERSION" \
          --notes "" \
          --latest
    # GitHub does not enforce a quota but keeps every asset forever. Keep the
    # downloads page readable and drop everything beyond the last few builds.
    - name: Prune old releases
      if: ${{ success() }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh release list --limit 100 --json tagName,isLatest --jq '.[].tagName' \
          | tail -n +6 \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "deleting $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
